
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Hindustaan - My Playlist</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .player-box { background: #222; padding: 30px; border-radius: 15px; max-width: 400px; margin: 30px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #ff4757; }
        audio { width: 100%; margin-top: 20px; }
        #now-playing { margin-top: 10px; font-size: 14px; color: #2ed573; font-weight: bold; }
    </style>
</head>
<body>

    <div class="player-box">
        <h2>📻 Radio Hindustaan Live</h2>
        <p>Aapka Apna Non-Stop Radio Station</p>
        
        <div id="now-playing">Gaana Load Ho Raha Hai...</div>
        
        <!-- Audio Player Jo Gaane Bajayea -->
        <audio id="radio-player" controls autoplay></audio>
    </div>

    <script>
        // YAHA AAPKA GOOGLE DRIVE LINK JUDA HUA HAI
        const playlist = [
            {
                title: "aap - jaisa - yaar mujhe -chahiye",
                url: "https://drive.google.com/uc?export=download&id=1t3FgjXyj5O0EWnOaN5SdhP8K60-stdYX"
            }
        ];

        let currentTrackIndex = 0;
        const player = document.getElementById('radio-player');
        const statusText = document.getElementById('now-playing');

        function playTrack(index) {
            if(playlist.length === 0) return;
            currentTrackIndex = index;
            player.src = playlist[index].url;
            statusText.innerText = "Abhi Chal Raha Hai: 🎵 " + playlist[index].title;
            player.play().catch(err => {
                statusText.innerText = "Play Button Par Click Karein ▶️";
            });
        }

        // Jab ek gaana khatam ho, toh agla apne aap shuru ho jaye
        player.onended = function() {
            let nextIndex = currentTrackIndex + 1;
            if (nextIndex >= playlist.length) {
                nextIndex = 0; // Playlist khatam hone par wapas pehle gaane se shuru ho
            }
            playTrack(nextIndex);
        };

        // Radio shuru karne ke liye
        window.onload = function() {
            playTrack(0);
        };
    </script>
</body>
</html>
