<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Live FM Radio & Playlist Player</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --list-hover: #334155;
        }
        body {
            margin: 0;
            padding: 20px 0;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .radio-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }
        .station-title {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .track-info {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .vinyl-disk {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #333 31%, #111 60%, #000 70%);
            margin: 0 auto 20px auto;
            border: 5px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .vinyl-center {
            width: 30px;
            height: 30px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }
        .rotate {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-side {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px;
            font-size: 16px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
        }
        .btn-play {
            background: var(--accent-color);
            border: none;
            color: #000;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            flex-grow: 1;
            margin: 0 10px;
        }
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .volume-slider {
            width: 85%;
            accent-color: var(--accent-color);
        }
        .playlist-header {
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-color);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
        .playlist-box {
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
        }
