<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Live FM Radio Player</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .radio-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }
        .station-title {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .status-tag {
            font-size: 12px;
            background: #ef4444;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .vinyl-disk {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #333 31%, #111 60%, #000 70%);
            margin: 0 auto 25px auto;
            border: 5px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .vinyl-center {
            width: 40px;
            height: 40px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }
        .rotate {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .controls {
            margin-bottom: 20px;
        }
        .btn-play {
            background: var(--accent-color);
            border: none;
            color: #000;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
        }
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 10px;
        }
        .volume-slider {
            width: 80%;
            accent-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="radio-container">
        <div class="station-title">My FM Radio</div>
        <div class="status-tag" id="status">Live</div>

        <div class="vinyl-disk" id="disk">
            <div class="vinyl-center"></div>
        </div>

        <audio id="radioPlayer" preload="none">
            <source src="https://files.catbox.moe/uunij0.mp3" type="audio/mpeg">
            Aapka browser audio support nahi karta.
        </audio>

        <div class="controls">
            <button class="btn-play" id="playBtn">▶ PLAY</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
        </div>
    </div>

    <script>
        const audio = document.getElementById('radioPlayer');
        const playBtn = document.getElementById('playBtn');
        const disk = document.getElementById('disk');
        const volumeSlider = document.getElementById('volumeSlider');
        const statusTag = document.getElementById('status');

        playBtn.addEventListener('click', function() {
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        playBtn.innerText = '⏸ PAUSE';
                        disk.classList.add('rotate');
                        statusTag.style.background = '#22c55e';
                        statusTag.innerText = 'Playing';
                    })
                    .catch(error => {
                        alert('Play nahi ho saka. Kripya link check karein.');
                    });
            } else {
                audio.pause();
                playBtn.innerText = '▶ PLAY';
                disk.classList.remove('rotate');
                statusTag.style.background = '#ef4444';
                statusTag.innerText = 'Live';
            }
        });

        volumeSlider.addEventListener('input', function(e) {
            audio.volume = e.target.value;
        });
    </script>
</body>
</html>
