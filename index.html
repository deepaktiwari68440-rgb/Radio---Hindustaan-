<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Live FM Radio & Playlist Player</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --list-hover: #334155;
        }
        body {
            margin: 0;
            padding: 20px 0;
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .radio-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }
        .station-title {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--accent-color);
        }
        .track-info {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .vinyl-disk {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #333 31%, #111 60%, #000 70%);
            margin: 0 auto 20px auto;
            border: 5px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .vinyl-center {
            width: 30px;
            height: 30px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }
        .rotate {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-side {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 10px;
            font-size: 16px;
            border-radius: 50%;
            cursor: pointer;
            width: 45px;
            height: 45px;
        }
        .btn-play {
            background: var(--accent-color);
            border: none;
            color: #000;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            flex-grow: 1;
            margin: 0 10px;
        }
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .volume-slider {
            width: 85%;
            accent-color: var(--accent-color);
        }
        .playlist-header {
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--accent-color);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
        .playlist-box {
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px;
        }
        .playlist-item {
            padding: 10px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item:hover {
            background: var(--list-hover);
        }
        .playlist-item.active {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
            font-weight: bold;
        }
        .playlist-box::-webkit-scrollbar {
            width: 5px;
        }
        .playlist-box::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="radio-container">
        <div class="station-title">My FM Radio</div>
        <div class="track-info" id="trackNo">Loading Tracks...</div>

        <div class="vinyl-disk" id="disk">
            <div class="vinyl-center"></div>
        </div>

        <div class="controls-row">
            <button class="btn-side" id="prevBtn">⏮</button>
            <button class="btn-play" id="playBtn">▶ PLAY</button>
            <button class="btn-side" id="nextBtn">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
        </div>

        <div class="playlist-header">🎵 Select Song to Play:</div>
        <div class="playlist-box" id="playlistView"></div>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const disk = document.getElementById('disk');
        const volumeSlider = document.getElementById('volumeSlider');
        const trackNoText = document.getElementById('trackNo');
        const playlistView = document.getElementById('playlistView');
        
        let audio = new Audio();
        audio.preload = "none";
        
        let playlist = [];
        let currentTrackIndex = 0;

        // 🟢 NAYA CODESPATIAL LINK JO APNE AAP GOOGLE SHEET SE LINKS NIKAL LEGA
        const sheetUrl = "https://google.com";

        function loadPlaylist() {
            // Hum .pubhtml se hi direct fetch karke links filter kar lenge
            fetch(sheetUrl)
                .then(response => response.text())
                .then(htmlText => {
                    // Regular expression jo html page ke andar se hara/blue catbox link dhoondh nikalega
                    const urlRegex = /https:\/\/files\.catbox\.moe\/[a-zA-Z0-9]+\.mp3/g;
                    const matches = htmlText.match(urlRegex) || [];
                    
                    // Duplicate links hatane ke liye
                    playlist = [...new Set(matches)];
                    
                    if(playlist.length > 0) {
                        renderPlaylistUI();
                        changeTrack(0, false);
                    } else {
                        trackNoText.innerText = "Sheet khali hai, pehle links dalein!";
                    }
                })
                .catch(err => {
                    trackNoText.innerText = "Error loading tracks";
                    console.error(err);
                });
        }

        function renderPlaylistUI() {
            playlistView.innerHTML = "";
            playlist.forEach((link, index) => {
                let fileName = link.substring(link.lastIndexOf('/') + 1);
                if(fileName.length > 25) fileName = fileName.substring(0, 22) + "...";
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.id = `track-${index}`;
                item.innerHTML = `<span>▶ Song ${index + 1} (${fileName})</span>`;
                
                item.addEventListener('click', () => {
                    changeTrack(index, true);
                });
                playlistView.appendChild(item);
            });
        }

        function changeTrack(index, shouldPlay) {
            document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
            currentTrackIndex = index;
            audio.src = playlist[currentTrackIndex];
            trackNoText.innerText = `Track ${currentTrackIndex + 1} of ${playlist.length}`;
            
            const activeItem = document.getElementById(`track-${index}`);
            if(activeItem) activeItem.classList.add('active');

            if (shouldPlay) {
                audio.play()
                    .then(() => {
                        playBtn.innerText = '⏸ PAUSE';
                        disk.classList.add('rotate');
                    })
                    .catch(e => console.log("Playback error"));
            }
        }

        audio.addEventListener('ended', function() {
            if (currentTrackIndex < playlist.length - 1) {
                changeTrack(currentTrackIndex + 1, true);
            } else {
                changeTrack(0, true); 
            }
        });

        playBtn.addEventListener('click', function() {
            if (playlist.length === 0) return;
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        playBtn.innerText = '⏸ PAUSE';
                        disk.classList.add('rotate');
                    })
                    .catch(error => alert('Gana play nahi ho saka!'));
            } else {
                audio.pause();
                playBtn.innerText = '▶ PLAY';
                disk.classList.remove('rotate');
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentTrackIndex < playlist.length - 1) {
