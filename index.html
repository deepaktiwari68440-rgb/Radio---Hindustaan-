<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Hindustaan - Non-Stop Premium Radio</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #121626; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .player-box { background: #1a2238; border-radius: 20px; padding: 30px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid #2d3748; }
        h2 { color: #f43f5e; font-size: 24px; margin-bottom: 5px; }
        .subtitle { font-size: 12px; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 25px; }
        .disc-container { width: 150px; height: 150px; margin: 0 auto 25px; position: relative; }
        .disc { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, #475569 10%, #0f172a 11%, #000 30%, #1e293b 70%, #000 100%); box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 3px solid #334155; }
        #now-playing { font-size: 15px; color: #38bdf8; font-weight: 600; margin-bottom: 20px; min-height: 22px; }
        audio { width: 100%; border-radius: 30px; outline: none; }
    </style>
</head>
<body>

    <div class="player-box">
        <h2>Radio Hindustaan</h2>
        <div class="subtitle">Non-Stop Premium Radio</div>
        
        <div class="disc-container">
            <div class="disc" id="vinyl-disc"></div>
        </div>
        
        <div id="now-playing">Gaana Load Ho Raha Hai...</div>
        <audio id="radio-player" controls autoplay></audio>
    </div>

    <script>
        const playlist = [
            {
                title: "Radio Hindustaan Non-Stop Hits",
                url: url: "https://soundhelix.com"

            }
        ];

        let currentTrackIndex = 0;
        const player = document.getElementById('radio-player');
        const statusText = document.getElementById('now-playing');

        function playTrack(index) {
            if (playlist.length === 0) return;
            currentTrackIndex = index;
            player.src = playlist[index].url;
            statusText.innerText = playlist[index].title;
            
            player.play().catch(err => {
                statusText.innerText = "▶ Play Button Dabayein";
            });
        }

        player.onended = function() {
            let nextIndex = currentTrackIndex + 1;
            if (nextIndex >= playlist.length) { nextIndex = 0; }
            playTrack(nextIndex);
        };

        window.onload = function() {
            playTrack(0);
        };
    </script>
</body>
</html>
